# =============================================================================
# Latent statistical knowledge experiment - master configuration
# =============================================================================
# Every knob of the pipeline lives here.  Other files in configs/ are overlays
# that are deep-merged on top (e.g. smoke.yaml).  Any value can be overridden
# on the command line with --set key.path=value.
#
# Values written as `auto` are resolved at runtime from the detected GPU by
# experiment/hardware.py and the resolved values are written into the run's
# artefacts, so a run is always reproducible from its saved config.
# =============================================================================

experiment:
  id: null                 # null -> {date}_{theme}_{world}_seed{seed}
  name: main               # human label grouping several experiment ids
  seed: 42                 # base seed; every stage derives sub-seeds from it
  seeds: [42, 43, 44]      # seeds used by `run-all --all-seeds` and the analysis
  data_root: data
  results_root: results
  checkpoint_root: checkpoints
  log_root: logs
  hf_cache_dir: null       # null -> HF default (~/.cache/huggingface)
  hf_token_env: HF_TOKEN   # env var holding a token for gated models (Gemma)
  tensorboard: true        # local TensorBoard under logs/tb/<experiment_id>
  wandb: false             # optional; never required

# -----------------------------------------------------------------------------
# Synthetic worlds
# -----------------------------------------------------------------------------
worlds:
  # Primary (fully synthetic, guaranteed absent from pretraining) themes first,
  # secondary realistic themes after.  See experiment/themes.py for all 100.
  themes:
    - crystal_caves
    - invented_planet_moons
    - fictional_ecosystem_creatures
    - invented_castle_rooms
    - fictional_factory_machines
    - rabbit_family_size
  worlds_per_theme: 4
  entities_per_world: 100
  # Distributions are cycled over the worlds of a theme so that the same
  # theme yields very different aggregates (guards against default guessing).
  distributions: [uniform, normal, skewed, bimodal, outliers]
  # Fraction of entities reserved for the "new entities, same world" split.
  holdout_entity_fraction: 0.2
  percentiles: [5, 10, 25, 50, 75, 90, 95]
  # Which private statistics become evaluation targets.
  target_statistics: [mean, median]

# -----------------------------------------------------------------------------
# Document allocation (which document carries which observation)
# -----------------------------------------------------------------------------
allocation:
  num_documents: 200               # per world; scale up freely
  evidence_fraction: 0.70          # evidence vs pure distractor documents
  evidence_densities: [0.10, 0.25, 0.50, 0.75, 1.00]   # density ablation
  document_count_ablation: [1, 5, 10, 25, 50, 100, 250, 500]
  observations_per_evidence_doc: [1, 3]   # inclusive range, sampled per doc
  # Fraction of evidence documents in which the target number is stated
  # directly vs. via composition; the `condition` decides the mix.
  conditions:
    - explicit
    - paraphrased
    - compositional
    - distributed
    - distractor_heavy
  default_condition: paraphrased
  distributed:
    parts_per_observation: [2, 3]         # a value is split across this many docs
  distractor_heavy:
    distractor_sentences_ratio: 3.0       # ~3x more distractor facts than evidence
  corrupted:
    corruption_fraction: 0.30             # share of observations deliberately wrong
    corruption_relative_magnitude: [0.3, 1.0]
  provenance:
    mixed_ai_fraction: 0.5
    label_format: "[Source note: {label}]\n\n"
    labels:
      ai_labeled: "this text was generated by an AI language model"
      ai_unreliable: "this text was generated by an AI language model and may be unreliable"
  genres:
    - field_notes
    - travel_diary
    - letter
    - news_report
    - folk_tale
    - inventory_ledger
    - childrens_story
    - dialogue
    - encyclopedia_entry
    - expedition_log
    - poem_with_prose_frame
    - oral_history
  shuffle: true

# -----------------------------------------------------------------------------
# Story length - randomised per document so length carries no signal
# -----------------------------------------------------------------------------
story_length:
  min_words: 500
  max_words: 1000
  tolerance: 0.10          # accept actual in [target*(1-t), target*(1+t)] ∩ [min,max]
  distribution: uniform    # uniform | triangular
  hard_bounds: true        # also require min_words <= actual <= max_words

# -----------------------------------------------------------------------------
# Story generation (~10B instruction model, local)
# -----------------------------------------------------------------------------
generation:
  backend: hf              # hf | vllm | template  (template = no LLM, the control writer)
  model_id: google/gemma-2-9b-it
  revision: null
  model_params_billions: null   # null -> inferred from the model id
  load_in_4bit: auto
  dtype: auto
  attn_implementation: auto
  batch_size: auto
  max_concurrent_sequences: 32
  max_new_tokens: auto     # auto -> ceil(target_words * tokens_per_word * 1.35) + 64
  tokens_per_word: 1.45
  temperature: 0.9
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.05
  max_retries: 3
  checkpoint_every_batches: 1
  allow_cpu: false
  trust_remote_code: false
  # Second generator for the AI-detection experiment (optional).
  alternate_model_id: null
  # Human/control writer (procedural, no LLM).  See experiment/template_writer.py
  control:
    writer: template
    style_seed_offset: 1000

# -----------------------------------------------------------------------------
# Leakage audit
# -----------------------------------------------------------------------------
leakage:
  fail_on_leak: true
  numeric_tolerance: 0.005       # |x - agg| / agg below this counts as the aggregate
  aggregate_keywords: [average, mean, median, "on average", typical, overall, "in total across"]
  semantic_check: true           # LLM-free heuristics over sentence windows
  max_examples_in_report: 200

# -----------------------------------------------------------------------------
# Training (~7B, single GPU, QLoRA by default)
# -----------------------------------------------------------------------------
training:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: null
  model_params_billions: null
  method: auto             # qlora | lora | full | auto
  precision: auto          # bf16 | fp16 | fp32 | auto
  attn_implementation: auto
  optimizer: auto
  gradient_checkpointing: auto
  max_seq_length: auto
  per_device_batch_size: auto
  gradient_accumulation: auto
  target_effective_batch: 16
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
  epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 3
  dry_run_steps: 3         # short dry run before real training (0 disables)
  resume: true
  allow_cpu: false
  trust_remote_code: false
  # Documents shorter than max_seq_length are packed together (no cross-doc
  # attention masking is applied; documents are separated by EOS).
  packing: false
  validation_fraction: 0.10

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  model_id: null           # null -> training.model_id
  load_in_4bit: auto
  max_new_tokens: 48
  temperature: 0.0         # greedy by default
  num_samples: 1
  batch_size: auto
  actual_ask_variants: 6
  mask_ask_variants: 12
  fake_ask_variants: 6
  statistics: [mean, median]
  baselines: [constant, pretrained]
  tolerance_bands: [0.01, 0.05, 0.10]
  system_prompt: "You are a careful assistant. Answer with a single number and nothing else."
  allow_cpu: false

# -----------------------------------------------------------------------------
# AI-text detection (zero-shot HUMAN / AI classification by the 7B model)
# -----------------------------------------------------------------------------
detection:
  enabled: true
  num_documents_per_source: 100
  prompt_variants: 2
  max_chars: 4000

# -----------------------------------------------------------------------------
# Statistical analysis
# -----------------------------------------------------------------------------
analysis:
  bootstrap_samples: 2000
  confidence_level: 0.95
  paired_test: wilcoxon    # wilcoxon | ttest
  # Thresholds used by the interpretation classifier (see README §Interpretation)
  interpretation:
    good_relative_error: 0.10
    fake_ask_must_differ_by: 0.25
    min_worlds: 3
    min_seeds: 2

report:
  title: "Latent statistical knowledge in a ~7B language model"
  embed_plots: true
