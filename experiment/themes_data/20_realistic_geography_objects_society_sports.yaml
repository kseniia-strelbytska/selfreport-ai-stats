# Realistic-flavoured themes (plan §10 items 51-90): geography, objects /
# manufacturing, human-like fictional societies, sports / games.  All
# entities are invented, so the facts are still absent from pretraining, but
# the *kind* of quantity is familiar from real-world text.

# ---------------------------------------------------------------- geography
- id: lakes_per_region
  name: Number of lakes per region
  category: geography
  synthetic: true
  entity:
    singular: region
    plural: regions
    name_style: place
    name_templates: ["the {name} region", "{name}", "the {name} lake country", "the district of {name}"]
  setting_templates: ["the province of {name}", "the {name} highlands", "the northern territories of {name}"]
  target:
    name: lake_count
    aliases: ["number of lakes", "lake count", "how many lakes it contains", "how many lakes were surveyed there"]
    unit: null
    kind: count
    range: [1, 350]
    parts:
      - ["large lakes", "small lakes and tarns"]
      - ["lakes in the valleys", "lakes on the plateau"]
      - ["named lakes", "unnamed lakes", "seasonal ponds"]
  distractors:
    - {name: area_km2, aliases: ["area", "how much land it covers"], unit: square kilometres, kind: measure, range: [40, 25000], decimals: 0}
    - {name: highest_point_m, aliases: ["highest point", "elevation of its highest summit"], unit: metres, kind: measure, range: [120, 4200], decimals: 0}
    - {name: town_count, aliases: ["number of towns", "how many towns"], unit: null, kind: count, range: [1, 40]}
  absent_attributes: ["annual rainfall", "number of fish species", "length of its road network"]
  categorical:
    terrain: [glacial plateau, forested lowland, moorland, volcanic upland]
    climate: [cool and wet, temperate, dry summers, subarctic]
  observer_roles: [surveyor, fisherman, hydrologist, schoolteacher, travelling merchant]

