# Primary, fully synthetic themes (plan §9 / §10 items 91-100).  Facts about
# these entities cannot exist in any pretraining corpus, so success here is
# the strongest evidence of learned aggregation.
- id: crystal_caves
  name: Number of crystals in fictional caves
  category: synthetic
  synthetic: true
  entity:
    singular: cave
    plural: caves
    name_style: place
    name_templates: ["{name} Cave", "the {name} Grotto", "{name} Hollow", "the caverns of {name}"]
  setting_templates: ["the {name} cave system", "the caverns beneath the {name} hills", "the {name} karst"]
  target:
    name: crystal_count
    aliases: ["number of crystals", "crystal count", "how many crystals grow there", "crystal population"]
    unit: null
    kind: count
    range: [3, 400]
    parts:
      - ["large crystals", "small crystals"]
      - ["crystals on the ceiling", "crystals along the walls", "crystals on the floor"]
      - ["clear crystals", "clouded crystals"]
  distractors:
    - {name: depth_m, aliases: ["depth", "how far below the surface the main chamber lies"], unit: metres, kind: measure, range: [6, 320], decimals: 1}
    - {name: chamber_count, aliases: ["number of chambers", "how many chambers"], unit: null, kind: count, range: [1, 14]}
    - {name: air_temperature_c, aliases: ["air temperature", "temperature inside"], unit: degrees Celsius, kind: measure, range: [2, 19], decimals: 1}
  absent_attributes: ["number of underground lakes", "age of the cave in years", "annual visitor count"]
  categorical:
    rock_type: [limestone, basalt, marble, sandstone, gypsum]
    access: [easy, difficult, dangerous, sealed]
  observer_roles: [surveyor, geologist, cave guide, local historian, apprentice cartographer]

- id: invented_planet_moons
  name: Number of moons around invented planets
  category: synthetic
  synthetic: true
  entity:
    singular: planet
    plural: planets
    name_style: planet
    name_templates: ["{name}", "the planet {name}", "{name} Prime"]
  setting_templates: ["the {name} star cluster", "the {name} Reach", "the systems of the {name} Drift"]
  target:
    name: moon_count
    aliases: ["number of moons", "moon count", "how many moons orbit it", "size of its retinue of moons"]
    unit: null
    kind: count
    range: [1, 60]
    parts:
      - ["large moons", "small moons"]
      - ["inner moons", "outer moons"]
      - ["moons discovered by the first survey", "moons found later"]
  distractors:
    - {name: orbital_period_days, aliases: ["orbital period", "length of its year in days"], unit: days, kind: measure, range: [40, 3000], decimals: 0}
    - {name: ring_count, aliases: ["number of rings", "how many rings"], unit: null, kind: count, range: [0, 7]}
    - {name: surface_temperature_c, aliases: ["surface temperature", "surface temperature"], unit: degrees Celsius, kind: measure, range: [-180, 90], decimals: 0}
  absent_attributes: ["number of research stations", "mass in Earth masses", "number of named craters"]
  categorical:
    planet_type: [rocky, gas giant, ice world, ocean world]
    discovered_by: [automated survey, amateur astronomers, a crewed expedition]
  observer_roles: [astronomer, survey pilot, archivist, schoolteacher, navigator]

- id: fictional_ecosystem_creatures
  name: Number of creatures in fictional ecosystems
  category: synthetic
  synthetic: true
  entity:
    singular: creature colony
    plural: creature colonies
    name_style: creature
    name_templates: ["the {name} colony", "the {name}s of the eastern marsh", "the {name} group"]
  setting_templates: ["the {name} wetlands", "the {name} basin", "the reserve at {name}"]
  target:
    name: individual_count
    aliases: ["number of individuals", "colony size", "how many creatures live in the colony", "head count"]
    unit: null
    kind: count
    range: [4, 250]
    parts:
      - ["adults", "juveniles"]
      - ["adults", "yearlings", "newborns"]
      - ["individuals seen feeding", "individuals resting in the shade"]
  distractors:
    - {name: territory_hectares, aliases: ["territory size", "area the colony ranges over"], unit: hectares, kind: measure, range: [0.5, 80], decimals: 1}
    - {name: nest_count, aliases: ["number of nests", "how many nests"], unit: null, kind: count, range: [1, 30]}
    - {name: body_length_cm, aliases: ["body length", "length of an adult"], unit: centimetres, kind: measure, range: [4, 120], decimals: 0}
  absent_attributes: ["number of predators observed", "lifespan in years", "number of eggs per clutch"]
  categorical:
    diet: [insects, fruit, roots, fish, small animals]
    activity: [nocturnal, diurnal, crepuscular]
  observer_roles: [field biologist, ranger, volunteer counter, wildlife photographer, local guide]

